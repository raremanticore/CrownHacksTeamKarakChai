<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3ed" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Volo | Discover volunteer events</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar"><a class="brand" href="/">Volo</a><nav><a class="active" href="/events.html">Discover</a><a href="/#how-it-works">How it works</a><a href="/#about">About us</a></nav><span class="location-label">Charlotte, NC</span></header>
      <main>
        <section class="events-hero"><p class="eyebrow">Your next good thing</p><h1>Find your way<br /><em>to help.</em></h1><p>Browse local volunteer events and find a meaningful way to spend a few hours.</p><div class="search-bar"><span aria-hidden="true">⌕</span><input id="event-search" type="search" placeholder="Search events, causes, or organizations" /></div></section>
        <section class="discovery" aria-labelledby="events-heading"><div class="section-heading"><div><p class="eyebrow">Near Charlotte</p><h2 id="events-heading">Volunteer events</h2></div><span class="result-count" id="result-count"></span></div><div class="filters"><div class="category-filters" id="category-filters"><button class="active" data-category="All events">All events</button><button data-category="Environment">Environment</button><button data-category="Community">Community</button><button data-category="Food access">Food access</button><button data-category="Animals">Animals</button></div><label class="sort-control">Sort <select id="sort-events"><option value="date">Soonest</option><option value="distance">Closest</option></select></label></div><div class="events-grid" id="events-grid"><p class="loading">Loading events from Supabase...</p></div></section>
      </main>
      <footer><a class="brand" href="/">Volo</a><span>Made for people who care.</span></footer>
    </div>
